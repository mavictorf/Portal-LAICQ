{% extends "base.html" %}
{% from "_macros.html" import csrf %}
{% block titulo %}Meu perfil{% endblock %}

{% block conteudo %}
<h1>Meu perfil</h1>
<p class="note center"><em>{{ user.email }} · {{ user.cargo }}</em></p>
<hr>

<form class="form" action="{{ url_for('auth.perfil') }}" method="post">
	{{ csrf() }}
	<label for="nome">Nome completo:</label>
	<input type="text" id="nome" name="nome" size="40" maxlength="120" value="{{ request.form.get('nome', user.nome) }}" required>
	<label for="campus">Campus:</label>
	<input type="text" id="campus" name="campus" size="40" maxlength="80" value="{{ request.form.get('campus', user.campus or '') }}">
	<label for="curso">Curso:</label>
	<input type="text" id="curso" name="curso" size="40" maxlength="120" value="{{ request.form.get('curso', user.curso or '') }}">
	<span></span>
	<label><input type="checkbox" name="no_diretorio" value="1" {% if (request.form.get('no_diretorio') if request.method == 'POST' else user.no_diretorio) %}checked{% endif %}> Aparecer no Diretório público</label>

	<span></span><strong>Trocar senha (opcional)</strong>
	<label for="senha_atual">Senha atual:</label>
	<input type="password" id="senha_atual" name="senha_atual" size="40" autocomplete="current-password">
	<label for="senha_nova">Nova senha:</label>
	<input type="password" id="senha_nova" name="senha_nova" size="40" minlength="8" autocomplete="new-password">
	<label for="senha_nova2">Repita a nova senha:</label>
	<input type="password" id="senha_nova2" name="senha_nova2" size="40" minlength="8" autocomplete="new-password">

	<div class="buttons"><input type="submit" value="Salvar"></div>
</form>
{% endblock %}
